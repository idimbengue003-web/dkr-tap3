<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Logo ScanBridge : 3 finder patterns de QR code (top-left, top-right, bottom-left)
       reliés par un pont en pointillés (le "bridge"). Couleur emerald #10b981.
       Fond transparent → fonctionne sur fond clair (admin) ET foncé (page d'attente). -->

  <!-- Finder pattern top-left : plein -->
  <rect x="6" y="6" width="18" height="18" rx="3.5" fill="#10b981"/>

  <!-- Finder pattern top-right : outline -->
  <rect x="40" y="6" width="18" height="18" rx="3.5" fill="none" stroke="#10b981" stroke-width="2.5"/>

  <!-- Finder pattern bottom-left : outline -->
  <rect x="6" y="40" width="18" height="18" rx="3.5" fill="none" stroke="#10b981" stroke-width="2.5"/>

  <!-- Pont (bridge) en pointillés qui traverse le centre -->
  <path d="M 49 25 Q 32 32 25 49"
        stroke="#10b981"
        stroke-width="2.5"
        fill="none"
        stroke-linecap="round"
        stroke-dasharray="2.5 3.5"/>

  <!-- Petit point central pour renforcer l'effet "scan" -->
  <circle cx="32" cy="32" r="2" fill="#10b981"/>
</svg>
