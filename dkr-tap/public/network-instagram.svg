<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none">
  <!-- Instagram : carré arrondi avec dégradé caractéristique + objectif -->
  <defs>
    <radialGradient id="ig-grad-bg" cx="30%" cy="107%" r="120%">
      <stop offset="0%" stop-color="#fdf497"/>
      <stop offset="5%" stop-color="#fdf497"/>
      <stop offset="45%" stop-color="#fd5949"/>
      <stop offset="60%" stop-color="#d6249f"/>
      <stop offset="90%" stop-color="#285AEB"/>
    </radialGradient>
    <linearGradient id="ig-grad-overlay" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf497"/>
      <stop offset="5%" stop-color="#fdf497"/>
      <stop offset="45%" stop-color="#fd5949"/>
      <stop offset="60%" stop-color="#d6249f"/>
      <stop offset="90%" stop-color="#285AEB"/>
    </linearGradient>
  </defs>
  <!-- Carré arrondi fondé dégradé -->
  <rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="url(#ig-grad-overlay)"/>
  <!-- Cercle objectif (contour blanc) -->
  <circle cx="12" cy="12" r="5" fill="none" stroke="white" stroke-width="2"/>
  <!-- Petit cercle lentille (haut droit) -->
  <circle cx="17.5" cy="6.5" r="1.3" fill="white"/>
</svg>
